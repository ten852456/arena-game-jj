# Mochi Moon on one server: http://<server>:8787
# Build the image first (deploy/DEPLOY.md), then:  docker compose -f deploy/docker-compose.yml up -d
services:
  mochi-moon:
    image: mochi-moon:latest
    container_name: mochi-moon
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
    volumes:
      - mochi-data:/app/data

volumes:
  mochi-data:
