<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mochi Moon</title>
    <meta name="description" content="Mochi Moon: a cute strategy auto-battler on the moon. Pack skill blocks into a grid and fight for the moon crown. / ศึกโมจิใต้แสงจันทร์ จัดบล็อก skill ลงตารางแล้วสู้ให้ชนะ" />
    <meta name="theme-color" content="#231c48" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mochi Moon" />
    <meta property="og:description" content="A cute strategy auto-battler on the moon: pack skill blocks into a grid, chain them, and fight other players’ builds." />
    <meta property="og:image" content="/assets/img/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/assets/img/stardust.webp" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header><b class="logo"><span class="logo-moon" aria-hidden="true">🌕</span> Mochi Moon</b></header>
    <div id="stage"></div>
    <main id="panel"><p class="muted">กำลังโหลด… · Loading…</p></main>
    <script type="module" src="./main.ts"></script>
    <script>
      // If the game code fails to load (bad module, network), say so instead of "loading" forever.
      setTimeout(function () {
        var p = document.getElementById('panel');
        if (p && p.textContent.indexOf('Loading') !== -1 && !document.querySelector('canvas')) {
          p.innerHTML = '<p style="color:#ff6b6b">โหลดเกมไม่สำเร็จ ลองรีเฟรช · The game failed to load, try refreshing (F12 → Console for details)</p>';
        }
      }, 10000);
    </script>
  </body>
</html>
